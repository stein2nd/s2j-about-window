name: s2j-about-window
options:
  bundleIdPrefix: com.s2j
  deploymentTarget:
    macOS: "14.6"
    iOS: "17.6"
  developmentLanguage: en
  usesTabs: false
  indentWidth: 4
  tabWidth: 4
  xcodeVersion: "26.3"
  projectFormat: xcode16_3

targets:
  S2JAboutWindow-macOS:
    type: framework
    platform: macOS
    deploymentTarget: "14.6"
    sources:
      - path: Sources/S2JAboutWindow
        excludes:
          - "**/*.md"
    resources:
      - path: Sources/S2JAboutWindow/Resources
    settings:
      base:
        PRODUCT_NAME: S2JAboutWindow
        PRODUCT_BUNDLE_IDENTIFIER: com.s2j.S2JAboutWindow
        SWIFT_VERSION: "6.3"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
        DEVELOPMENT_LANGUAGE: en
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.6"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: -Onone
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O

  S2JAboutWindow-iOS:
    type: framework
    platform: iOS
    deploymentTarget: "17.6"
    sources:
      - path: Sources/S2JAboutWindow
        excludes:
          - "**/*.md"
    resources:
      - path: Sources/S2JAboutWindow/Resources
    settings:
      base:
        PRODUCT_NAME: S2JAboutWindow
        PRODUCT_BUNDLE_IDENTIFIER: com.s2j.S2JAboutWindow
        SWIFT_VERSION: "6.3"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
        DEVELOPMENT_LANGUAGE: en
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        IPHONEOS_DEPLOYMENT_TARGET: "17.6"
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: -Onone
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O

  S2JAboutWindowTests-macOS:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.6"
    sources:
      - path: Tests/S2JAboutWindowTests
    dependencies:
      - target: S2JAboutWindow-macOS
    settings:
      base:
        PRODUCT_NAME: S2JAboutWindowTests
        PRODUCT_BUNDLE_IDENTIFIER: com.s2j.S2JAboutWindowTests
        SWIFT_VERSION: "6.3"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
        DEVELOPMENT_LANGUAGE: en
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.6"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: -Onone
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O

  SampleApp:
    type: application
    platform: macOS
    deploymentTarget: "14.6"
    sources:
      - path: SampleApp.swift
    settings:
      base:
        PRODUCT_NAME: SampleApp
        PRODUCT_BUNDLE_IDENTIFIER: com.s2j.S2JAboutWindow.SampleApp
        SWIFT_VERSION: "6.3"
        MACOSX_DEPLOYMENT_TARGET: "14.6"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_LANGUAGE: en
    dependencies:
      - target: S2JAboutWindow-macOS

  S2JAboutWindowTests-iOS:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.6"
    sources:
      - path: Tests/S2JAboutWindowTests
    dependencies:
      - target: S2JAboutWindow-iOS
    settings:
      base:
        PRODUCT_NAME: S2JAboutWindowTests
        PRODUCT_BUNDLE_IDENTIFIER: com.s2j.S2JAboutWindowTests
        SWIFT_VERSION: "6.3"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
        DEVELOPMENT_LANGUAGE: en
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        IPHONEOS_DEPLOYMENT_TARGET: "17.6"
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: -Onone
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O

schemes:
  SampleApp:
    build:
      targets:
        SampleApp: all
        S2JAboutWindow-macOS: all
    run:
      config: Debug
  S2JAboutWindow:
    build:
      targets:
        S2JAboutWindow-macOS: all
        S2JAboutWindow-iOS: all
    test:
      targets:
        - S2JAboutWindowTests-macOS
        - S2JAboutWindowTests-iOS
    run:
      config: Debug
    archive:
      config: Release
  S2JAboutWindow-macOS:
    build:
      targets:
        S2JAboutWindow-macOS: all
    test:
      targets:
        - S2JAboutWindowTests-macOS
    run:
      config: Debug
    archive:
      config: Release
  S2JAboutWindow-iOS:
    build:
      targets:
        S2JAboutWindow-iOS: all
    test:
      targets:
        - S2JAboutWindowTests-iOS
      destination:
        platform: iOS Simulator
    run:
      config: Debug
      destination:
        platform: iOS Simulator
    archive:
      config: Release
