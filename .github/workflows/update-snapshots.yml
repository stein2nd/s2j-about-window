name: Update Snapshots

on:
  workflow_dispatch:

jobs:
  record-macos:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Force-select Xcode app (26.5 -> 26.4.1 -> 26.3)
        run: |
          set -euo pipefail
          CANDIDATES=(
            "/Applications/Xcode_26.5.app/Contents/Developer"
            "/Applications/Xcode_26.4.1.app/Contents/Developer"
            "/Applications/Xcode_26.4.app/Contents/Developer"
            "/Applications/Xcode_26.3.app/Contents/Developer"
            "/Applications/Xcode_26.3.0.app/Contents/Developer"
            "/Applications/Xcode.app/Contents/Developer"
          )
          SELECTED=""
          for p in "${CANDIDATES[@]}"; do
            if [ -d "$p" ]; then
              SELECTED="$p"
              break
            fi
          done
          if [ -n "$SELECTED" ]; then
            echo "Selecting Xcode at: $SELECTED"
            sudo xcode-select -s "$SELECTED"
            echo "DEVELOPER_DIR=$SELECTED" >> $GITHUB_ENV
          else
            echo "No preferred Xcode app path found among candidates."
            exit 1
          fi

      - name: Record AboutView snapshot references
        # assertSnapshot は record 時も XCTest を失敗させるため、PNG 生成後に成功判定する
        run: |
          set +e
          SNAPSHOT_TESTING_RECORD=all swift test --filter AboutViewSnapshotTests
          test -f Tests/S2JAboutWindowTests/__Snapshots__/AboutViewSnapshotTests/testAboutViewSnapshot_light.1.png
          test -f Tests/S2JAboutWindowTests/__Snapshots__/AboutViewSnapshotTests/testMarkdownViewSnapshot_light.1.png
          test -f Tests/S2JAboutWindowTests/__Snapshots__/AboutViewSnapshotTests/testAboutViewClassicHorizontalSnapshot_light.1.png

      - name: Upload reference PNGs
        uses: actions/upload-artifact@v6
        with:
          name: snapshot-references
          path: Tests/S2JAboutWindowTests/__Snapshots__/
          if-no-files-found: error